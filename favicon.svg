<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Frosty Haven">
  <title>Frosty Haven</title>
  <!-- Plum ground so the mark reads on both light and dark browser chrome. -->
  <rect width="32" height="32" rx="7.5" fill="#241535"/>
  <g fill="#F32379">
    <!-- Cone. -->
    <path d="M10.9 19.4h10.2a.6.6 0 0 1 .5.95l-4.9 7.2a.85.85 0 0 1-1.4 0l-4.9-7.2a.6.6 0 0 1 .5-.95Z"/>
    <!-- Three stacked swirls, narrowing upward. Stepped rather than curled:
         a drawn spiral turns to mush at 16px, this still reads as soft serve. -->
    <rect x="9.6" y="14.6" width="12.8" height="5" rx="2.5"/>
    <rect x="11.2" y="10.3" width="9.6" height="5" rx="2.5"/>
    <rect x="12.8" y="6" width="6.4" height="5" rx="2.5"/>
  </g>
</svg>
